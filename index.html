<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF6B6B" />
  <meta name="description" content="EducaKids - Aprendé jugando. Mundos educativos para niños." />
  <title>EducaKids · Aprendé jugando</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Preload de recursos críticos (Optimización de Producción) -->
  <link rel="preload" href="css/style.css" as="style" />
  <link rel="preload" href="js/app.js" as="script" />

  <!-- Fuente infantil (Fredoka, Education/Learning) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Barra superior: estrellas, medallas, perfil, sonido -->
  <header id="topbar" class="topbar">
    <button class="top-btn" id="btn-inicio" aria-label="Inicio" title="Inicio">🏠</button>
    <div class="top-stats">
      <span class="stat-pill" id="stat-estrellas" title="Estrellas">⭐ <b>0</b></span>
      <span class="stat-pill" id="stat-medallas" title="Medallas">🏅 <b>0</b></span>
      <span class="stat-pill" id="stat-racha" title="Días de racha">🔥 <b>1</b></span>
    </div>
    <div class="top-right">
      <button class="top-btn" id="btn-sonido" aria-label="Sonido" title="Sonido">🔊</button>
      <button class="top-btn avatar-btn" id="btn-perfil" aria-label="Perfil" title="Perfil">👤</button>
    </div>
  </header>

  <!-- Contenedor único: TODO el contenido se renderiza aquí por JS -->
  <main id="app" class="app">
    <!-- Feedback visual mientras cargan los scripts JS -->
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Fredoka', sans-serif; color: #555;">
      <h2>Cargando EducaKids... 🚀</h2>
    </div>
  </main>

  <!-- Advertencia si el navegador bloquea JavaScript -->
  <noscript>
    <div style="text-align: center; padding: 20px; background: #FF6B6B; color: white; font-family: 'Fredoka', sans-serif; position: relative; z-index: 9999;">
      ¡Ups! Necesitas activar JavaScript en tu navegador para poder jugar. ⚙️
    </div>
  </noscript>

  <!-- Capa de confeti / celebraciones -->
  <div id="fx" class="fx-layer" aria-hidden="true"></div>

  <!-- Modal genérico (medallas, avisos) -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- Módulos del proyecto (orden de carga importante). Se usa defer para no bloquear el HTML -->
  <script defer src="js/store.js"></script>     <!-- guardado, puntos, niveles, medallas -->
  <script defer src="js/audio.js"></script>     <!-- efectos de sonido WebAudio -->
  <script defer src="js/voz.js"></script>       <!-- profesor virtual: lee todo en voz alta -->
  <script defer src="js/engine.js"></script>    <!-- motor de preguntas reutilizable -->
  <script defer src="js/mundos.js"></script>    <!-- datos de los mundos + generadores -->
  <script defer src="js/geografia.js"></script> <!-- 🌍 Geografía Argentina -->
  <script defer src="js/lengua-sociales.js"></script><!-- 📖 Lengua + 🏛️ Sociales -->
  <script defer src="js/minijuegos.js"></script><!-- minijuegos del Mundo Juegos -->
  <script defer src="js/juegos-nuevos.js"></script><!-- 5 minijuegos extra -->
  <script defer src="js/dibujo.js"></script>    <!-- tablero de dibujo (Creatividad) -->
  <script defer src="js/mascota.js"></script>   <!-- 🦊 mascota virtual Luna -->
  <script defer src="js/escuelas.js"></script>  <!-- 🤖💻⚙️ 3 Escuelas del Futuro -->
  <script defer src="js/app.js"></script>       <!-- navegación, pantallas, inicio -->
</body>
</html>
