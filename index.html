<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF6B6B" />
  <meta name="description" content="EducaKids - Aprendé jugando. Mundos educativos para niños." />
  <title>EducaKids · Aprendé jugando</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Fuente infantil -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- RUTA AL CSS NUEVO -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="topbar" class="topbar">
    <button class="top-btn" id="btn-inicio" aria-label="Inicio" title="Inicio">🏠</button>
    <div class="top-stats">
      <span class="stat-pill" id="stat-estrellas" title="Estrellas">⭐ <b>0</b></span>
      <span class="stat-pill" id="stat-medallas" title="Medallas">🏅 <b>0</b></span>
      <span class="stat-pill" id="stat-racha" title="Días de racha">🔥 <b>1</b></span>
    </div>
    <div class="top-right">
      <button class="top-btn" id="btn-sonido" aria-label="Sonido" title="Sonido">🔊</button>
      <button class="top-btn avatar-btn" id="btn-perfil" aria-label="Perfil" title="Perfil">👤</button>
    </div>
  </header>

  <!-- Contenedor único -->
  <main id="app" class="app">
    <!-- Texto temporal por si Vercel tarda en cargar el JS -->
    <div style="display: flex; justify-content: center; align-items: center; height: 80vh; font-family: 'Fredoka', sans-serif; color: #555;">
      <h2>Cargando EducaKids... 🚀</h2>
    </div>
  </main>

  <div id="fx" class="fx-layer" aria-hidden="true"></div>

  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- TUS 13 SCRIPTS NUEVOS (Con defer para optimizar la carga) -->
  <script defer src="js/store.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/voz.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="js/mundos.js"></script>
  <script defer src="js/geografia.js"></script>
  <script defer src="js/lengua-sociales.js"></script>
  <script defer src="js/minijuegos.js"></script>
  <script defer src="js/juegos-nuevos.js"></script>
  <script defer src="js/dibujo.js"></script>
  <script defer src="js/mascota.js"></script>
  <script defer src="js/escuelas.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
