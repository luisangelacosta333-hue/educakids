  <!-- ============================================================
       VOZ DE NARRADOR — ESPAÑOL LATINO (no España) — TODA LA APP
       Se carga DESPUÉS de voz.js para sobrescribir la voz anterior.
       ============================================================ -->
  <script>
  (function () {
    'use strict';
    window.EK = window.EK || {};
    EK.Voz = EK.Voz || {};

    var vocesDisponibles = [];

    function cargarVoces() {
      try { vocesDisponibles = window.speechSynthesis.getVoices() || []; } catch (e) {}
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = cargarVoces;
      cargarVoces();
      setTimeout(cargarVoces, 500);
      setTimeout(cargarVoces, 1500);
      setTimeout(cargarVoces, 3000);
    }

    function elegirVoz(codigoIdioma) {
      if (!vocesDisponibles.length) cargarVoces();
      var vocesDelIdioma = vocesDisponibles.filter(function (v) {
        return (v.lang || '').toLowerCase().startsWith(codigoIdioma.toLowerCase());
      });
      if (!vocesDelIdioma.length) return null;
      // PRIORIDAD: voces LATINOAMERICANAS (419, MX, AR, US, CL, CO, PE) + naturales/Google
      var latino = vocesDelIdioma.filter(function (v) {
        var l = (v.lang || '').toLowerCase();
        return l.indexOf('419') >= 0 || l.indexOf('mx') >= 0 || l.indexOf('ar') >= 0 ||
               l.indexOf('us') >= 0 || l.indexOf('cl') >= 0 || l.indexOf('co') >= 0 || l.indexOf('pe') >= 0;
      });
      var lista = latino.length ? latino : vocesDelIdioma;
      var preferida = lista.find(function (v) {
        var n = (v.name || '').toLowerCase();
        return n.indexOf('natural') >= 0 || n.indexOf('google') >= 0 || n.indexOf('microsoft') >= 0 ||
               n.indexOf('male') >= 0 || n.indexOf('hombre') >= 0 || n.indexOf('jorge') >= 0 ||
               n.indexOf('andres') >= 0 || n.indexOf('andrés') >= 0 || n.indexOf('latino') >= 0 || n.indexOf('mexico') >= 0;
      });
      return preferida || lista[0];
    }

    function hablarConVozNarrador(texto, opts) {
      opts = opts || {};
      if (!('speechSynthesis' in window)) return false;
      try { window.speechSynthesis.cancel(); } catch (e) {}
      var idioma = opts.lang || 'es-419'; // ESPAÑOL LATINOAMERICANO
      var u = new SpeechSynthesisUtterance(texto);
      u.lang = idioma;
      u.pitch = opts.pitch || 0.85;  // grave, tono narrador (no infantil)
      u.rate = opts.rate || 0.92;    // pausado
      u.volume = opts.volume != null ? opts.volume : 1;
      var voz = elegirVoz((idioma || 'es').slice(0, 2));
      if (voz) u.voice = voz;
      if (typeof opts.onend === 'function') u.onend = opts.onend;
      if (typeof opts.onboundary === 'function') u.onboundary = opts.onboundary;
      window.speechSynthesis.speak(u);
      return true;
    }

    function detenerVoz() {
      try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
    }

    window.hablarNarrador = function (texto, idioma) {
      return hablarConVozNarrador(texto, { lang: idioma || 'es-419' });
    };
    window.detenerNarrador = detenerVoz;

    // Sobrescribe el motor de voz de la app para que TODO use esta voz
    EK.Voz.hablar = function (texto, opts) { return hablarConVozNarrador(texto, opts); };
    EK.Voz.detener = detenerVoz;
    EK.Voz.elegirVoz = elegirVoz;
    EK.Voz.recargarVoces = cargarVoces;
  })();
  </script>
