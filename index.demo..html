<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuentos del Mundo — Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #3B2E7E 0%, #5B4DB8 50%, #2E8BC0 100%);
    min-height: 100vh; color: #fff; padding: 12px;
  }
  #app { max-width: 520px; margin: 0 auto; }
  .demo-top { text-align: center; padding: 10px 0 16px; }
  .demo-top h1 { font-size: 22px; }
  .demo-top p { opacity: .85; font-size: 13px; margin-top: 4px; }

  /* ====== estilos mínimos para las clases .sb-* ====== */
  .sb-root { background: #fff; color: #333; border-radius: 22px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .sb-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .sb-header > div { flex: 1; }
  .sb-title { font-size: 18px; color: #3B2E7E; }
  .sb-subtitle { font-size: 12px; color: #888; margin-top: 2px; }
  .sb-btn-back { width: 40px; height: 40px; border-radius: 50%; border: none; background: #f0f0f0; font-size: 18px; cursor: pointer; }
  .sb-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .sb-tab { flex: 1; padding: 8px; border: none; border-radius: 12px; background: #f0f0f0; cursor: pointer; font-size: 12px; font-weight: 700; }
  .sb-tab.active { background: #FF9F43; color: #fff; }
  .sb-search-wrap { position: relative; margin-bottom: 10px; }
  .sb-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); }
  .sb-search { width: 100%; padding: 10px 12px 10px 36px; border-radius: 14px; border: 2px solid #eee; font-size: 14px; }
  .sb-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
  .sb-chip { flex-shrink: 0; padding: 6px 12px; border-radius: 16px; border: none; background: #f0f0f0; cursor: pointer; font-size: 12px; font-weight: 700; }
  .sb-chip.active { background: #5B4DB8; color: #fff; }
  .sb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sb-book-card { position: relative; background: #fafafa; border-radius: 16px; overflow: hidden; cursor: pointer; border: 2px solid transparent; }
  .sb-book-card:hover { border-color: #FF9F43; }
  .sb-fav-btn { position: absolute; top: 6px; right: 6px; z-index: 2; background: none; border: none; font-size: 18px; cursor: pointer; }
  .sb-book-cover { height: 90px; display: flex; align-items: center; justify-content: center; font-size: 44px; }
  .sb-book-info { padding: 8px; }
  .sb-book-title { font-size: 13px; margin-bottom: 4px; color: #333; }
  .sb-book-meta { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-bottom: 6px; }
  .sb-badge { color: #fff; padding: 2px 6px; border-radius: 8px; }
  .sb-progress-bar { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
  .sb-progress-fill { height: 100%; background: #FF9F43; border-radius: 3px; transition: width .3s; }
  .sb-empty { text-align: center; padding: 40px 20px; color: #999; }
  .sb-empty .big { font-size: 48px; display: block; margin-bottom: 10px; }
  .sb-loader { text-align: center; padding: 60px 20px; color: #888; }
  .sb-spinner { width: 36px; height: 36px; border: 4px solid #eee; border-top-color: #FF9F43; border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sb-action-btn { padding: 10px 16px; border: none; border-radius: 14px; cursor: pointer; font-weight: 700; font-size: 13px; margin: 4px; }
  .sb-action-btn.primary { background: #FF9F43; color: #fff; }
  .sb-action-btn.secondary { background: #4D96FF; color: #fff; }
  .sb-action-btn.accent { background: #6BCB77; color: #fff; }
  .sb-action-btn.ghost { background: #f0f0f0; color: #555; }
  .sb-action-row { display: flex; flex-wrap: wrap; justify-content: center; }
  .sb-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 99; }

  /* Lector */
  .sb-reader { background: #fffdf7; border-radius: 16px; padding: 12px; }
  .sb-page-illustration { height: 140px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 72px; margin-bottom: 12px; }
  .sb-page-text { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .sb-sentence { display: flex; align-items: flex-start; gap: 8px; padding: 8px; border-radius: 10px; background: #fff; }
  .sb-sentence.playing { background: #FFF3E0; }
  .sb-sentence-text { flex: 1; font-size: 15px; line-height: 1.5; }
  .sb-sentence-translation { display: block; font-size: 12px; color: #888; margin-top: 4px; }
  .sb-speak-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: #FF9F43; color: #fff; cursor: pointer; flex-shrink: 0; }
  .sb-speak-btn.secondary { background: #4D96FF; }
  .sb-toggle-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
  .sb-toggle { padding: 6px 12px; border-radius: 14px; border: none; background: #f0f0f0; cursor: pointer; font-size: 12px; font-weight: 700; }
  .sb-toggle.on { background: #FF9F43; color: #fff; }
  .sb-reader-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sb-nav-btn { padding: 10px 14px; border: none; border-radius: 12px; background: #5B4DB8; color: #fff; cursor: pointer; font-weight: 700; font-size: 13px; }
  .sb-nav-btn:disabled { opacity: .4; cursor: default; }
  .sb-page-indicator { font-size: 13px; color: #888; font-weight: 700; }

  /* Vocabulario */
  .sb-vocab-card { display: flex; align-items: center; gap: 10px; background: #fff; padding: 10px; border-radius: 12px; margin-bottom: 8px; }
  .sb-vocab-img { font-size: 28px; }
  .sb-vocab-words { flex: 1; }
  .sb-vocab-es { font-size: 14px; font-weight: 700; }
  .sb-vocab-en { font-size: 12px; color: #888; }
  .sb-vocab-speak { width: 32px; height: 32px; border-radius: 50%; border: none; background: #FF9F43; color: #fff; cursor: pointer; }

  /* Quiz */
  .sb-quiz-q { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .sb-quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .sb-quiz-opt { padding: 12px; border-radius: 12px; border: 2px solid #eee; background: #fff; cursor: pointer; font-size: 14px; text-align: left; }
  .sb-quiz-opt.correct { background: #D4EDDA; border-color: #6BCB77; }
  .sb-quiz-opt.wrong { background: #F8D7DA; border-color: #FA5252; }
  .sb-quiz-feedback { margin-top: 12px; font-weight: 700; text-align: center; }

  /* Juego de emparejar */
  .sb-match-hud { text-align: center; margin: 10px 0; font-weight: 700; color: #555; }
  .sb-match-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sb-match-card { aspect-ratio: 1; border-radius: 12px; border: none; background: #FFD93D; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; }
  .sb-match-card.matched { background: #D4EDDA; cursor: default; }

  .sb-finish { text-align: center; padding: 30px 10px; }
  .sb-finish .trophy { font-size: 64px; display: block; margin-bottom: 12px; }
  .sb-finish h3 { color: #3B2E7E; margin-bottom: 8px; }
  .sb-finish p { color: #888; margin-bottom: 16px; }
  .sb-page-enter { animation: enter .3s ease; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="demo-top">
    <h1>🌍 Cuentos del Mundo</h1>
    <p>Demo multilenguaje — abrilo con un servidor local (no con doble click)</p>
  </div>
  <div id="app"></div>

  <!-- ORDEN IMPORTANTE: voz.js → storybooks.js → storybooks-reader.js -->
  <script src="voz.js"></script>
  <script src="storybooks.js"></script>
  <script src="storybooks-reader.js"></script>
  <script>
    // Abrir el mundo de cuentos automáticamente en el contenedor #app
    window.addEventListener('load', function () {
      if (window.EK && EK.Storybooks) EK.Storybooks.abrir(document.getElementById('app'));
    });
  </script>
</body>
</html>
