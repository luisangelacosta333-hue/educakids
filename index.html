<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF6B6B" />
  <meta name="description" content="EducaKids - Aprendé jugando. Mundos educativos para niños." />
  <title>EducaKids · Aprendé jugando</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Fuente infantil -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- RUTA CORREGIDA: Sin carpeta 'css/' -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar" class="topbar">
    <button class="top-btn" id="btn-inicio" aria-label="Inicio" title="Inicio">🏠</button>
    <div class="top-stats">
      <span class="stat-pill" id="stat-estrellas" title="Estrellas">⭐ <b>0</b></span>
      <span class="stat-pill" id="stat-medallas" title="Medallas">🏅 <b>0</b></span>
      <span class="stat-pill" id="stat-racha" title="Días de racha">🔥 <b>1</b></span>
    </div>
    <div class="top-right">
      <button class="top-btn" id="btn-sonido" aria-label="Sonido" title="Sonido">🔊</button>
      <button class="top-btn avatar-btn" id="btn-perfil" aria-label="Perfil" title="Perfil">👤</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <div id="fx" class="fx-layer" aria-hidden="true"></div>

  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- RUTAS CORREGIDAS: Sin carpeta 'js/'. Todos los scripts nuevos están aquí -->
  <script src="store.js"></script>
  <script src="audio.js"></script>
  <script src="voz.js"></script>
  <script src="engine.js"></script>
  <script src="mundos.js"></script>
  <script src="geografia.js"></script>
  <script src="lengua-sociales.js"></script>
  <script src="minijuegos.js"></script>
  <script src="juegos-nuevos.js"></script>
  <script src="dibujo.js"></script>
  <script src="mascota.js"></script>
  <script src="escuelas.js"></script>
  <script src="app.js"></script>
</body>
</html>
